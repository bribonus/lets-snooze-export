name: Deploy App to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - 'artifacts/lets-snooze/**'
      - 'lib/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-app.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Expo web app
        working-directory: artifacts/lets-snooze
        run: pnpm exec expo export --platform web
        env:
          NODE_ENV: production

      - name: Add Azure routing config
        run: cp artifacts/lets-snooze/staticwebapp.config.json artifacts/lets-snooze/dist/

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: expo-web-app
          path: artifacts/lets-snooze/dist/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: expo-web-app
          path: dist/

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_APP }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: 'dist'
          output_location: ''
          skip_app_build: true
